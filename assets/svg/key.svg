<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="keyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00EEFF" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Bow (top ring) -->
  <circle cx="50" cy="28" r="16" fill="none" stroke="#00DDFF" stroke-width="7" filter="url(#keyGlow)"/>
  <!-- Shaft -->
  <rect x="46.5" y="44" width="7" height="42" fill="#00DDFF" filter="url(#keyGlow)"/>
  <!-- Bits -->
  <rect x="53.5" y="66" width="14" height="6" fill="#00DDFF"/>
  <rect x="53.5" y="78" width="18" height="6" fill="#00DDFF"/>
</svg>
