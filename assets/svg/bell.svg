<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="bellGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FFDD00" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Handle ring -->
  <circle cx="50" cy="18" r="8" fill="none" stroke="#FFAA00" stroke-width="4"/>
  <!-- Bell Body -->
  <path d="M 50,26 C 36,26 30,50 20,74 L 80,74 C 70,50 64,26 50,26 Z" fill="#FFD700" filter="url(#bellGlow)"/>
  <!-- Bottom rim -->
  <rect x="16" y="74" width="68" height="8" rx="4" fill="#FFAA00"/>
  <!-- Clapper -->
  <circle cx="50" cy="85" r="7" fill="#00D2FF"/>
</svg>
