<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <filter id="yellowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffd700" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Pacman body with open mouth facing right (angle ~60 deg mouth opening) -->
  <path d="M 50,50 L 93.3,25 A 50,50 0 1 0 93.3,75 Z" fill="#FFFF00" filter="url(#yellowGlow)"/>
  <!-- Subtle eye dot -->
  <circle cx="50" cy="22" r="4.5" fill="#111122"/>
</svg>
